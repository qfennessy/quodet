[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quodet"
version = "0.1.0"
description = "Watch changed files and ask an LLM to review them"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["watchdog>=6,<7"]

[project.scripts]
quodet = "watch_files:main"
quodet-codex-hook = "codex_feedback_hook:main"
quodet-claude-hook = "codex_feedback_hook:main"
quodet-agent = "agent_integration:main"

[tool.setuptools]
py-modules = [
    "watch_files",
    "feedback",
    "redaction",
    "review_output",
    "codex_feedback_hook",
    "agent_integration",
    "model_runner",
    "recommendation_grounding",
]
