[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quodet"
version = "0.1.0"
description = "Watch changed files and ask an LLM to review them"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["watchdog>=6,<7"]

[project.scripts]
quodet = "watch_files:main"

[tool.setuptools]
py-modules = ["watch_files"]
